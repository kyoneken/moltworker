# APM 0.29.0. Run from this directory; see docs/harness-setup.md.
name: moltworker-harness
version: "0.1.0"
targets: [codex, claude, cursor, grok-build, antigravity]
includes: []
dependencies:
  apm:
    # Retrieve the exact revision/files in harness/source-lock.json via GitHub MCP.
    # This local dependency keeps APM from making GitHub network calls.
    - path: './.harness/source/coding-agent-harness'
  mcp:
    # These register servers; they do not install executables or authenticate.
    - name: 1password
      registry: false
      transport: stdio
      command: 1password-mcp
    - name: cloudflare-docs
      registry: false
      transport: streamable-http
      url: https://docs.mcp.cloudflare.com/mcp
